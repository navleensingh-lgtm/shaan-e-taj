# https://render.com/docs/blueprint-spec
# Dashboard: New > Blueprint > connect navleensingh-lgtm/shaan-e-taj

databases:
  - name: shaanetaj-db
    databaseName: shaanetaj
    user: shaanetaj
    plan: free

services:
  - type: web
    name: shaanetaj-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shaanetaj-db
          property: connectionString
      - key: API_PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - fromGroup: shaanetaj-secrets

  - type: web
    name: shaanetaj-web
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.web
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shaanetaj-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - fromGroup: shaanetaj-secrets

envVarGroups:
  - name: shaanetaj-secrets
    envVars:
      - key: INTERNAL_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
